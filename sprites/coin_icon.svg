<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coinGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#coinGradient)" stroke="#FFD700" stroke-width="2" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
  <circle cx="32" cy="32" r="4" fill="#FFD700" opacity="0.8"/>
</svg>

