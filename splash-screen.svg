<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coinGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Planetas de fondo -->
  <circle cx="300" cy="200" r="150" fill="#2a2a4e" opacity="0.3"/>
  <circle cx="1600" cy="800" r="200" fill="#1a1a3e" opacity="0.4"/>
  <circle cx="500" cy="900" r="100" fill="#2a2a4e" opacity="0.3"/>
  
  <!-- Moneda principal -->
  <circle cx="960" cy="400" r="120" fill="url(#coinGradient)" stroke="#FFD700" stroke-width="5" filter="url(#glow)"/>
  <circle cx="960" cy="400" r="85" fill="none" stroke="#FFA500" stroke-width="3" opacity="0.6"/>
  <circle cx="960" cy="400" r="50" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <circle cx="960" cy="400" r="20" fill="#FFD700" opacity="0.9"/>
  
  <!-- Título -->
  <text x="960" y="600" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Plataformero 3D</text>
  <text x="960" y="680" font-family="Arial, sans-serif" font-size="48" fill="#CCCCCC" text-anchor="middle">Proyecto Godot 4.5</text>
  
  <!-- Monedas decorativas -->
  <circle cx="200" cy="300" r="40" fill="url(#coinGradient)" opacity="0.6"/>
  <circle cx="1720" cy="500" r="50" fill="url(#coinGradient)" opacity="0.5"/>
  <circle cx="150" cy="800" r="35" fill="url(#coinGradient)" opacity="0.4"/>
  <circle cx="1770" cy="950" r="45" fill="url(#coinGradient)" opacity="0.5"/>
</svg>

